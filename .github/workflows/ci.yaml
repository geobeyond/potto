name: Continuous Integration

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'

  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

env:
  COLUMNS: 120
  PUBLISH_IMAGE: ${{ (github.ref_name == 'main' || github.ref_type == 'tag') && 'TRUE' || 'FALSE' }}

jobs:
  run_ci:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_NAME: "python-package"
      POTTO__BIND_HOST: "0.0.0.0"
      POTTO__BIND_PORT: "3001"
      POTTO__DATABASE_DSN: "postgresql+psycopg://potto:pottopass@localhost:55432/potto"
    steps:

      - name: "Grab code"
        uses: actions/checkout@v6.0.2

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: "Install uv"
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Install code with dev-related dependencies"
        run: uv sync --locked --all-groups

      - name: "Run ruff formatter"
        run: uv run ruff format --check

      - name: "Run ruff linter"
        run: uv run ruff check

      - name: "Run ty"
        run: uv run ty check

      - name: "Determine docker-related metadata"
        id: docker_metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{raw}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: "check generated docker metadata"
        run: |
          env | grep DOCKER_METADATA_OUTPUT
          echo 'OUTPUT LABELS = ${{ steps.docker_metadata.outputs.labels }}'
          echo 'OUTPUT TAGS = ${{ steps.docker_metadata.outputs.tags }}'
          echo 'OUTPUT ANNOTATIONS = ${{ steps.docker_metadata.outputs.annotations}}'

      - name: "Setup docker buildx"
        uses: docker/setup-buildx-action@v4.3.0
        with:
          driver: docker

      - name: "Build docker image"
        uses: docker/build-push-action@v7.3.0
        with:
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          push: false
          load: true
          file: docker/Dockerfile
          tags: |
            ${{ steps.docker_metadata.outputs.tags }}
            ghcr.io/geobeyond/potto/potto:ci-build
          labels: |
            ${{ steps.docker_metadata.outputs.labels }}

      - name: "Stand up compose stack for testing"
        run: |
          docker compose --file docker/compose.ci.yaml up --detach --wait

      - name: "Initialize potto database"
        run: |
          uv run potto db upgrade

      - name: "Validate OpenAPI schema with declared conformance classes"
        run: |
          nohup uv run potto run-server &
          echo $! > potto-server.pid

          uv run python scripts/wait-for-server.py http://localhost:3001/api/health

          uv run potto openapi validate --format table --no-error-on-failure

          if [ -f potto-server.pid ]; then
              echo "Shutting down potto server with PID $(cat potto-server.pid)..."
              kill $(cat potto-server.pid)  || true
              rm potto-server.pid
          fi

      - name: "Export OpenAPI schema document"
        run: uv run potto openapi export --output potto_openapi_ci.json

      - name: "Lint OpenAPI schema with spectral"
        run: |
          npm install --global @stoplight/spectral-cli@6.15.0
          spectral lint potto_openapi_ci.json \
          --ruleset spectral/spectral.yaml \
          --fail-severity info \
          --format github-actions

      - name: "Run integration tests"
        run: |
          docker compose --file docker/compose.ci.yaml --profile test run --rm potto-test

      - name: "Run e2e tests"
        run: |
          docker compose --file docker/compose.ci.yaml --profile e2e run --rm potto-e2e

      - name: "bootstrap potto database with data for OGC CITE testing"
        run: |
          echo "12345678" | uv run potto user create cite-admin --password-stdin --scope admin
          uv run potto cite-testing bootstrap-ogc-api-features-1

      - name: "Launch potto server for OGC CITE testing"
        env:
          POTTO__PUBLIC_URL: "http://host.docker.internal:3001"
          POTTO__USE_OAS30_FIXES: "true"
        run: |
          nohup uv run potto run-server &
          echo $! > potto-server.pid

          uv run python scripts/wait-for-server.py http://localhost:3001/api/health

      - name: "Run OGC CITE tests"
        env:
          PUBLIC_URL: "http://host.docker.internal:3001"
        uses: OSGEO/ogc-cite-runner@v0.3.2
        with:
          test_suite_identifier: ogcapi-features-1.0
          test_session_arguments: >-
            iut=${{ env.PUBLIC_URL }}/api/
            noofcollections=-1

      - name: "Shut down potto server for OGC CITE testing"
        if: always()
        run: |
          if [ -f potto-server.pid ]; then
              echo "Shutting down potto server with PID $(cat potto-server.pid)..."
              kill $(cat potto-server.pid)  || true
              rm potto-server.pid
          fi

      - name: "Stand down compose stack"
        run: |
          docker compose --file docker/compose.ci.yaml down

      - name: "Build Python package"
        run: uv build

      - name: "Upload built package as artifact"
        id: upload_package_artifact
        uses: actions/upload-artifact@v7.0.1
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: "${{ env.ARTIFACT_NAME }}"
          path: dist/
          retention-days: 2

      - name: "Remove CI-only image tag"
        if: ${{ env.PUBLISH_IMAGE == 'TRUE' }}
        run: docker rmi ghcr.io/geobeyond/potto/potto:ci-build

      - name: "Login to container registry"
        if: ${{ env.PUBLISH_IMAGE == 'TRUE' }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.CI_MANAGEMENT_USERNAME }}
          password: ${{ secrets.CI_MANAGEMENT_PAT }}

      - name: "Push docker image to registry"
        id: push_image
        if: ${{ env.PUBLISH_IMAGE == 'TRUE' }}
        run: docker push --all-tags ghcr.io/geobeyond/potto/potto
