# docker compose file to be used for CI - do not use this in production!

name: potto


x-db-image: &db-image "postgis/postgis:17-3.5-alpine"

# the "ci-build" tag is the image the CI workflow's own build step (via
# docker/build-push-action + load: true) has already placed in the runner's
# local image store - not from source. This ensures CI tests the exact image
# it may go on to publish, instead of a separate rebuild.
x-potto-image: &potto-image "ghcr.io/geobeyond/potto/potto:ci-build"

x-potto-healthcheck: &potto-healthcheck
  test: >-
    python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:3001/api/health')"
  start_period: 10s
  interval: 5s
  retries: 10
  timeout: 5s

services:

  db:
    image: *db-image
    environment:
      POSTGRES_DB: potto
      POSTGRES_USER: potto
      POSTGRES_PASSWORD: pottopass
    ports:
      - target: 5432
        published: 55432
    healthcheck:
      test: "pg_isready -d potto -U potto"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

  test-db:
    image: *db-image
    environment:
      POSTGRES_DB: potto_test
      POSTGRES_USER: potto
      POSTGRES_PASSWORD: pottopass
    healthcheck:
      test: "pg_isready -d potto_test -U potto"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    ports:
      - target: 5432
        published: 55433

  # potto and potto-cite run the "ci-build" image directly, to serve as the
  # live server the OpenAPI validation and OGC CITE testing steps talk to.
  # They are never run at the same time, so it's fine that both publish the
  # same host port. They differ only in how they report their own public URL:
  # potto is reached from the CI host itself (localhost), while potto-cite is
  # reached from the OGC CITE test suite's own container, via
  # host.docker.internal - and the server bakes its public URL into
  # self-referential links at startup, so that needs to match.

  potto:
    image: *potto-image
    environment:
      POTTO__DATABASE_DSN: "postgresql+psycopg://potto:pottopass@db:5432/potto"
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *potto-healthcheck
    ports:
      - target: 3001
        published: 3001
    profiles:
      - app

  potto-cite:
    image: *potto-image
    environment:
      POTTO__DATABASE_DSN: "postgresql+psycopg://potto:pottopass@db:5432/potto"
      POTTO__PUBLIC_URL: "http://host.docker.internal:3001"
      POTTO__USE_OAS30_FIXES: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *potto-healthcheck
    ports:
      - target: 3001
        published: 3001
    profiles:
      - cite

  # potto-test and potto-e2e build FROM the "ci-build" tag instead of running
  # it directly, since they need the "dev" dependency group installed too.

  potto-test:
    build:
      context: ../
      dockerfile_inline: |
        FROM ghcr.io/geobeyond/potto/potto:ci-build
        RUN --mount=type=cache,uid=1000,gid=1000,target=/home/appuser/.cache/uv \
            uv sync --locked --group dev
    environment:
      POTTO__TEST_DATABASE_DSN: "postgresql+psycopg://potto:pottopass@test-db:5432/potto_test"
    depends_on:
      test-db:
        condition: service_healthy
    entrypoint: ["tini", "-g", "--"]
    command: ["uv", "run", "pytest", "-m", "not e2e"]
    profiles:
      - test

  potto-e2e:
    build:
      context: ../
      dockerfile_inline: |
        FROM ghcr.io/geobeyond/potto/potto:ci-build
        RUN --mount=type=cache,uid=1000,gid=1000,target=/home/appuser/.cache/uv \
            uv sync --locked --group dev
        USER root
        RUN uv run playwright install-deps chromium
        USER appuser
        RUN --mount=type=cache,uid=1000,gid=1000,target=/home/appuser/.cache/uv \
            uv run playwright install chromium
    environment:
      POTTO__TEST_DATABASE_DSN: "postgresql+psycopg://potto:pottopass@test-db:5432/potto_test"
    depends_on:
      test-db:
        condition: service_healthy
    entrypoint: ["tini", "-g", "--"]
    command: ["uv", "run", "pytest", "-m", "e2e"]
    profiles:
      - e2e
