# docker compose file to be used for CI - do not use this in production!

name: potto


x-db-image: &db-image "postgis/postgis:17-3.5-alpine"

services:

  db:
    image: *db-image
    environment:
      POSTGRES_DB: potto
      POSTGRES_USER: potto
      POSTGRES_PASSWORD: pottopass
    ports:
      - target: 5432
        published: 55432
    healthcheck:
      test: "pg_isready -d potto -U potto"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

  test-db:
    image: *db-image
    environment:
      POSTGRES_DB: potto_test
      POSTGRES_USER: potto
      POSTGRES_PASSWORD: pottopass
    healthcheck:
      test: "pg_isready -d potto_test -U potto"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    ports:
      - target: 5432
        published: 55433

  # potto-test and potto-e2e build FROM the "ci-build" tag, which the CI workflow's
  # own build step (via docker/build-push-action + load: true) has already placed
  # in the runner's local image store - not from source. This ensures CI tests the
  # exact image it may go on to publish, instead of a separate rebuild.

  potto-test:
    build:
      context: ../
      dockerfile_inline: |
        FROM ghcr.io/geobeyond/potto/potto:ci-build
        RUN --mount=type=cache,uid=1000,gid=1000,target=/home/appuser/.cache/uv \
            uv sync --locked --group dev
    environment:
      POTTO__TEST_DATABASE_DSN: "postgresql+psycopg://potto:pottopass@test-db:5432/potto_test"
    depends_on:
      test-db:
        condition: service_healthy
    entrypoint: ["tini", "-g", "--"]
    command: ["uv", "run", "pytest", "-m", "not e2e"]
    profiles:
      - test

  potto-e2e:
    build:
      context: ../
      dockerfile_inline: |
        FROM ghcr.io/geobeyond/potto/potto:ci-build
        RUN --mount=type=cache,uid=1000,gid=1000,target=/home/appuser/.cache/uv \
            uv sync --locked --group dev
        USER root
        RUN uv run playwright install-deps chromium
        USER appuser
        RUN --mount=type=cache,uid=1000,gid=1000,target=/home/appuser/.cache/uv \
            uv run playwright install chromium
    environment:
      POTTO__TEST_DATABASE_DSN: "postgresql+psycopg://potto:pottopass@test-db:5432/potto_test"
    depends_on:
      test-db:
        condition: service_healthy
    entrypoint: ["tini", "-g", "--"]
    command: ["uv", "run", "pytest", "-m", "e2e"]
    profiles:
      - e2e
