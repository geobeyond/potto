# docker compose file that can be used for development - do not use this in production!

name: potto


x-db-image: &db-image "postgis/postgis:17-3.5-alpine"

services:

  potto:
    image: ghcr.io/geobeyond/potto/potto:${CURRENT_GIT_BRANCH:-main}
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        GIT_COMMIT: ${CURRENT_GIT_COMMIT:-unknown}
    develop:
      watch:
        - path: ../src/potto
          action: sync
          target: /home/appuser/app/src/potto
        - path: ../tests
          action: sync
          target: /home/appuser/app/tests
        - path: ../pyproject.toml
          action: rebuild
        - path: ../uv.lock
          action: rebuild
    environment:
      DATA_ROOT: "/data"
      POTTO__DATABASE_DSN: "postgresql+psycopg://potto:pottopass@db:5432/potto"
      POTTO__TEST_DATABASE_DSN: "postgresql+psycopg://potto:pottopass@test-db:5432/potto_test"
      POTTO__DEBUG: "true"
      POTTO__UVICORN_LOG_CONFIG_FILE: "/home/appuser/app/uvicorn-log-config-no-db.yml"
      POTTO__ENV_WHITELIST: '["DATA_ROOT"]'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${POTTO_DATA_ROOT:?set POTTO_DATA_ROOT environment variable to your local data directory}
        target: /data
    ports:
      - target: 3001
        published: 3001

  potto-test:
    image: ghcr.io/geobeyond/potto/potto-test:${CURRENT_GIT_BRANCH:-main}
    build:
      context: ../
      dockerfile_inline: |
        FROM potto
        RUN --mount=type=cache,uid=1000,gid=1000,target=/home/appuser/.cache/uv \
            uv sync --locked --group dev
      additional_contexts:
        potto: service:potto
    develop:
      watch:
        - path: ../src/potto
          action: sync
          target: /home/appuser/app/src/potto
        - path: ../tests
          action: sync
          target: /home/appuser/app/tests
        - path: ../pyproject.toml
          action: rebuild
        - path: ../uv.lock
          action: rebuild
    environment:
      POTTO__TEST_DATABASE_DSN: "postgresql+psycopg://potto:pottopass@test-db:5432/potto_test"
    depends_on:
      test-db:
        condition: service_healthy
    entrypoint: ["tini", "-g", "--"]
    command: ["uv", "run", "pytest", "-m", "not e2e"]
    profiles:
      - test

  potto-e2e:
    image: ghcr.io/geobeyond/potto/potto-e2e:${CURRENT_GIT_BRANCH:-main}
    build:
      context: ../
      dockerfile_inline: |
        FROM potto
        RUN --mount=type=cache,uid=1000,gid=1000,target=/home/appuser/.cache/uv \
            uv sync --locked --group dev
        USER root
        RUN uv run playwright install-deps chromium
        USER appuser
        RUN --mount=type=cache,uid=1000,gid=1000,target=/home/appuser/.cache/uv \
            uv run playwright install chromium
      additional_contexts:
        potto: service:potto
    develop:
      watch:
        - path: ../src/potto
          action: sync
          target: /home/appuser/app/src/potto
        - path: ../tests
          action: sync
          target: /home/appuser/app/tests
        - path: ../pyproject.toml
          action: rebuild
        - path: ../uv.lock
          action: rebuild
    environment:
      POTTO__TEST_DATABASE_DSN: "postgresql+psycopg://potto:pottopass@test-db:5432/potto_test"
    depends_on:
      test-db:
        condition: service_healthy
    volumes:
      - ../test-results:/home/appuser/app/test-results
    entrypoint: ["tini", "-g", "--"]
    command: ["uv", "run", "pytest", "-m", "e2e"]
    profiles:
      - e2e

  db:
    image: *db-image
    environment:
      POSTGRES_DB: potto
      POSTGRES_USER: potto
      POSTGRES_PASSWORD: pottopass
    healthcheck:
      test: "pg_isready -d potto -U potto"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    ports:
      - target: 5432
        published: 55432
    volumes:
      - db:/var/lib/postgresql/data

  test-db:
    image: *db-image
    environment:
      POSTGRES_DB: potto_test
      POSTGRES_USER: potto
      POSTGRES_PASSWORD: pottopass
    healthcheck:
      test: "pg_isready -d potto_test -U potto"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    ports:
      - target: 5432
        published: 55433
    volumes:
      - test-db:/var/lib/postgresql/data
#
#  external-db:
#    image: *db-image
#    environment:
#      POSTGRES_DB: external
#      POSTGRES_USER: external
#      POSTGRES_PASSWORD: externalpass
#    healthcheck:
#      test: "pg_isready -d external -U extertnal"
#      start_period: 20s
#      interval: 30s
#      retries: 5
#      timeout: 5s
#    ports:
#      - target: 5432
#        published: 55433
#    volumes:
#      - external-db:/var/lib/postgresql/data

  keycloak:
    image: "quay.io/keycloak/keycloak:26.5.5"
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - target: 8080
        published: 58080
    volumes:
      - keycloak:/opt/keycloak/data
    healthcheck:
      test: "curl -sf http://localhost:8080/health/ready || exit 1"
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 5s
    profiles:
      - oidc

  opa:
    image: "openpolicyagent/opa:1.14.1"
    # reload policies from disk whenever they change
    command: run --server --watch --addr 0.0.0.0:8181 /policies
    ports:
      - target: 8181
        published: 58181
    volumes:
      - ./opa/policies:/policies
    healthcheck:
      test: "wget -qO- http://localhost:8181/health || exit 1"
      start_period: 5s
      interval: 15s
      retries: 3
      timeout: 3s
    profiles:
      - opa

volumes:
  db:
  test-db:
#  external-db:
  keycloak:
