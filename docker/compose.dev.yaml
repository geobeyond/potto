# docker compose file that can be used for development - do not use this in production!

name: potto


x-db-image: &db-image "postgis/postgis:17-3.5-alpine"

services:

  potto:
    image: ghcr.io/geobeyond/potto/potto:${CURRENT_GIT_BRANCH:-main}
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        GIT_COMMIT: ${CURRENT_GIT_COMMIT:-unknown}
    develop:
      watch:
        - path: ../src/potto
          action: sync
          target: /home/appuser/app/src/potto
        - path: ../tests
          action: sync
          target: /home/appuser/app/tests
        - path: ../pyproject.toml
          action: rebuild
        - path: ../uv.lock
          action: rebuild
    environment:
      DATA_ROOT: "/data"
      POTTO__DATABASE_DSN: "postgresql+psycopg://potto:pottopass@db:5432/potto"
      POTTO__TEST_DATABASE_DSN: "postgresql+psycopg://potto:pottopass@test-db:5432/potto_test"
      POTTO__DEBUG: "true"
      POTTO__UVICORN_LOG_CONFIG_FILE: "/home/appuser/app/uvicorn-log-config-no-db.yml"
      POTTO__ENV_WHITELIST: '["DATA_ROOT"]'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${POTTO_DATA_ROOT:?set POTTO_DATA_ROOT environment variable to your local data directory}
        target: /data
    ports:
      - target: 3001
        published: 3001

  potto-test:
    image: ghcr.io/geobeyond/potto/potto-test:${CURRENT_GIT_BRANCH:-main}
    build:
      context: ../
      dockerfile_inline: |
        FROM potto
        RUN --mount=type=cache,uid=1000,gid=1000,target=/home/appuser/.cache/uv \
            uv sync --locked --group dev
      additional_contexts:
        potto: service:potto
    develop:
      watch:
        - path: ../src/potto
          action: sync
          target: /home/appuser/app/src/potto
        - path: ../tests
          action: sync
          target: /home/appuser/app/tests
        - path: ../pyproject.toml
          action: rebuild
        - path: ../uv.lock
          action: rebuild
    environment:
      POTTO__TEST_DATABASE_DSN: "postgresql+psycopg://potto:pottopass@test-db:5432/potto_test"
    depends_on:
      test-db:
        condition: service_healthy
    entrypoint: ["tini", "-g", "--"]
    command: ["uv", "run", "pytest", "-m", "not e2e"]
    profiles:
      - test

  potto-e2e:
    image: ghcr.io/geobeyond/potto/potto-e2e:${CURRENT_GIT_BRANCH:-main}
    build:
      context: ../
      dockerfile_inline: |
        FROM potto
        RUN --mount=type=cache,uid=1000,gid=1000,target=/home/appuser/.cache/uv \
            uv sync --locked --group dev
        USER root
        RUN uv run playwright install-deps chromium
        USER appuser
        RUN --mount=type=cache,uid=1000,gid=1000,target=/home/appuser/.cache/uv \
            uv run playwright install chromium
      additional_contexts:
        potto: service:potto
    develop:
      watch:
        - path: ../src/potto
          action: sync
          target: /home/appuser/app/src/potto
        - path: ../tests
          action: sync
          target: /home/appuser/app/tests
        - path: ../pyproject.toml
          action: rebuild
        - path: ../uv.lock
          action: rebuild
    environment:
      POTTO__TEST_DATABASE_DSN: "postgresql+psycopg://potto:pottopass@test-db:5432/potto_test"
    depends_on:
      test-db:
        condition: service_healthy
    volumes:
      - ../test-results:/home/appuser/app/test-results
    entrypoint: ["tini", "-g", "--"]
    command: ["uv", "run", "pytest", "-m", "e2e"]
    profiles:
      - e2e

  potto-cite-bootstrap:
    image: ghcr.io/geobeyond/potto/potto:${CURRENT_GIT_BRANCH:-main}
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        GIT_COMMIT: ${CURRENT_GIT_COMMIT:-unknown}
    environment:
      POTTO__DATABASE_DSN: "postgresql+psycopg://potto:pottopass@cite-db:5432/potto_cite"
    depends_on:
      cite-db:
        condition: service_healthy
    entrypoint: ["tini", "-g", "--"]
    command:
      - "sh"
      - "-c"
      - |
        # cite-db's pg_isready healthcheck can report healthy against the transient
        # instance postgres runs during initdb, just before it restarts into the real
        # server - so retry the first connection for a bit rather than trusting it blindly.
        n=0
        until uv run potto db upgrade; do
          n=$((n + 1))
          if [ "$$n" -ge 15 ]; then
            echo "potto db upgrade did not succeed after retrying" >&2
            exit 1
          fi
          sleep 2
        done
        (printf '12345678' | uv run potto user create cite-admin --password-stdin --scope admin || true)
        uv run potto cite-testing bootstrap-ogcapi-features-1
    profiles:
      - cite

  potto-cite:
    image: ghcr.io/geobeyond/potto/potto:${CURRENT_GIT_BRANCH:-main}
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        GIT_COMMIT: ${CURRENT_GIT_COMMIT:-unknown}
    develop:
      watch:
        - path: ../src/potto
          action: sync
          target: /home/appuser/app/src/potto
        - path: ../tests
          action: sync
          target: /home/appuser/app/tests
        - path: ../pyproject.toml
          action: rebuild
        - path: ../uv.lock
          action: rebuild
    environment:
      POTTO__DATABASE_DSN: "postgresql+psycopg://potto:pottopass@cite-db:5432/potto_cite"
      POTTO__PUBLIC_URL: "http://potto-cite:3001"
      POTTO__USE_OAS30_FIXES: "true"
      POTTO__DEBUG: "true"
      POTTO__UVICORN_LOG_CONFIG_FILE: "/home/appuser/app/uvicorn-log-config-no-db.yml"
    depends_on:
      cite-db:
        condition: service_healthy
      potto-cite-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: >-
        python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:3001/api/health')"
      start_period: 10s
      interval: 5s
      retries: 10
      timeout: 5s
    ports:
      - target: 3001
        published: 3002
    profiles:
      - cite

  potto-cite-runner:
    image: ghcr.io/geobeyond/potto/potto-cite-runner:${CURRENT_GIT_BRANCH:-main}
    build:
      context: ../
      dockerfile_inline: |
        FROM potto
        RUN --mount=type=cache,uid=1000,gid=1000,target=/home/appuser/.cache/uv \
            uv sync --locked --group dev
      additional_contexts:
        potto: service:potto
    depends_on:
      potto-cite:
        condition: service_healthy
      ogc-teamengine:
        condition: service_healthy
    entrypoint: ["tini", "-g", "--"]
    command:
      - "uv"
      - "run"
      - "ogc-cite-runner"
      - "execute-test-suite"
      - "http://ogc-teamengine:8080/te2"
      - "ogcapi-features-1.0"
      - "--suite-input"
      - "iut"
      - "http://potto-cite:3001/api"
      - "--with-failed"
    profiles:
      - cite

  db:
    image: *db-image
    environment:
      POSTGRES_DB: potto
      POSTGRES_USER: potto
      POSTGRES_PASSWORD: pottopass
    healthcheck:
      test: "pg_isready -d potto -U potto"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    ports:
      - target: 5432
        published: 55432
    volumes:
      - db:/var/lib/postgresql/data

  test-db:
    image: *db-image
    environment:
      POSTGRES_DB: potto_test
      POSTGRES_USER: potto
      POSTGRES_PASSWORD: pottopass
    healthcheck:
      test: "pg_isready -d potto_test -U potto"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    ports:
      - target: 5432
        published: 55433
    volumes:
      - test-db:/var/lib/postgresql/data

  cite-db:
    image: *db-image
    environment:
      POSTGRES_DB: potto_cite
      POSTGRES_USER: potto
      POSTGRES_PASSWORD: pottopass
    healthcheck:
      test: "pg_isready -d potto_cite -U potto"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    ports:
      - target: 5432
        published: 55434
    volumes:
      - cite-db:/var/lib/postgresql/data
    profiles:
      - cite

  ogc-teamengine:
    image: "ogccite/teamengine-beta:1.0-SNAPSHOT"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      start_period: 40s
      interval: 10s
      retries: 10
      timeout: 5s
    ports:
      - target: 8080
        published: 59080
    profiles:
      - cite

  keycloak:
    image: "quay.io/keycloak/keycloak:26.5.5"
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - target: 8080
        published: 58080
    volumes:
      - keycloak:/opt/keycloak/data
    healthcheck:
      test: "curl -sf http://localhost:8080/health/ready || exit 1"
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 5s
    profiles:
      - oidc

  opa:
    image: "openpolicyagent/opa:1.14.1"
    # reload policies from disk whenever they change
    command: run --server --watch --addr 0.0.0.0:8181 /policies
    ports:
      - target: 8181
        published: 58181
    volumes:
      - ./opa/policies:/policies
    healthcheck:
      test: "wget -qO- http://localhost:8181/health || exit 1"
      start_period: 5s
      interval: 15s
      retries: 3
      timeout: 3s
    profiles:
      - opa

volumes:
  db:
  test-db:
  cite-db:
#  external-db:
  keycloak:
